# Every day: bumps versions.txt to the newest HumHub patch release of the
# current minor (update.sh) and, when it moved, pushes main and starts the
# Build workflow, which publishes ghcr.io/den-frie-vilje/humhub-<flavour>:<version>
# from main. The push comes from the workflow token, which starts no workflow
# by itself, so the build is dispatched here. The site repositories check
# versions.txt every day and move to the new image once its module test passes.

name: Auto Update

on:
  schedule:
    # 02:00 UTC; the sites check at 05:20 UTC, hours after a build has
    # published, so a new version reaches them the same morning.
    - cron: '0 2 * * *'
  repository_dispatch:
    types: check-update
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency: auto-update

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set git config
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
    - name: Execute Update
      id: update
      run: |
        . ./update.sh
        { echo "CUR_VERSION=$CUR_VERSION"; echo "NEW_VERSION=$NEW_VERSION"; echo "UPDATE_NEEDED=$UPDATE_NEEDED"; } >> "$GITHUB_ENV"
    - name: Push main and build
      if: env.UPDATE_NEEDED == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git push origin HEAD:main
        gh workflow run build.yml --ref main
